# XcodeGen spec for the native app. GrabberNative.xcodeproj is generated from this (the just recipes run
# `xcodegen` first) and is not committed: a new Swift file under App/ needs no project edit.
name: GrabberNative
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  ContextCore:
    path: ContextCore
  # Think a Card Trainer's card screen (#219, the trainer's D15): one screen, two apps. The trainer's private repo,
  # at a tag: a change there reaches this app when the tag here moves.
  ThinkACard:
    url: https://github.com/idvorkin/think-a-card-trainer
    exactVersion: 0.1.0
  # The report dialog, shake, dictation, What's new and iCloud delivery, shared with the other apps. Pinned to a
  # release tag exactly: every app and the Mac's reader must speak the same delivery format (bug-kit's rollout trains).
  BugKit:
    url: https://github.com/idvorkin/bug-kit
    exactVersion: 0.3.2
settings:
  base:
    DEVELOPMENT_TEAM: 45P6D3439T
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden on the xcodebuild line by the just recipes; Info.plist carries them to BuildInfo.
    GIT_SHA: dev
    # The report's commit: `git describe --always --dirty`, set by the justfile's builds; honest when missing.
    BUGKIT_COMMIT: unknown
    GIT_BRANCH: dev
targets:
  GrabberNative:
    type: application
    platform: iOS
    sources:
      - App
      # The Live Activity's attributes, compiled into the widget extension too.
      - Shared
      # The Gym Timer's cues and keepalive loop, shared with the React Native app until the cutover.
      - path: ../assets/audio/timer
        excludes:
          - "words/**"
        buildPhase: resources
      # The breathing screen's six spoken phrases (scripts/make-breath-words.sh).
      - path: ../assets/audio/breathe
        buildPhase: resources
      # The other count voices (stories 182, 187): <voice>-<cue>.wav, rendered by scripts/make-timer-voice.sh.
      - path: ../assets/audio/timer-voices
        buildPhase: resources
      # Story 137: the eulogy song, Igor's download of it from Suno (the post's song as of 2026-10-07).
      - path: ../assets/audio/eulogy
        buildPhase: resources
      # The mirror's fixture week, for the simulator hook (GRABBER_MIRROR); the host tests read the same file.
      - path: ContextCore/Tests/ContextCoreTests/Fixtures/mirror-fixture.json
        buildPhase: resources
    # Health: the mirror reads it (step 4). XcodeGen writes the file from these properties.
    entitlements:
      path: GrabberNative.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # The live tile reads the usage reading the app writes here (story 136).
        com.apple.security.application-groups:
          - group.com.idvorkin.grabbernative
        # Reports go up to Igor's private iCloud for the Mac's listener (story 152): BugKit's shared container.
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.idvorkin.BugKitReports
    dependencies:
      - package: ContextCore
      - package: ThinkACard
        product: ThinkACardCore
      - package: ThinkACard
        product: ThinkACardUI
      - package: BugKit
      - target: GrabberWidgets
    # What's new (story 148): the last month's story commits, made from git log at every build by BugKit's script.
    postBuildScripts:
      - name: What's new
        script: '"$BUILD_DIR/../../SourcePackages/checkouts/bug-kit/scripts/whats-new.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/whats-new.json" --repo "$SRCROOT/.." --path native --base-url https://github.com/idvorkin/context-grabber/blob/main/docs/stories/'
        basedOnDependencyAnalysis: false
        showEnvVars: false
      # The card screen's stack and voice clips, from Igor's Mac, never from this repo (scripts/native/bundle-trainer.sh).
      - name: Bundle the stack and voice
        script: '"$SRCROOT/../scripts/native/bundle-trainer.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" --voice'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        # Its own id until the cutover, so it installs beside Context Grabber (story 140).
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grabber Native
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The iPad turns every way (story 150); the phone stays upright.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The What's new phase reads the repository's git history and stories, outside what a sandbox allows.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  # The widget extension: the Live Activity (stories 106, 166) and the live tile (story 136).
  GrabberWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/GrabberWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.idvorkin.grabbernative
    dependencies:
      - package: ContextCore
      - package: ThinkACard
        product: ThinkACardCore
      - package: ThinkACard
        product: ThinkACardUI
    # Today's hand deals from the same stack (#219).
    postBuildScripts:
      - name: Bundle the stack
        script: '"$SRCROOT/../scripts/native/bundle-trainer.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.widgets
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grabber Native
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # Simulator only: grants Health access through Health's own sheet, the one tap a script cannot make
  # (`just native-sim-health`; docs/TESTING.md).
  GrabberNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: GrabberNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idvorkin.grabbernative.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GrabberNative
        CODE_SIGN_STYLE: Automatic
schemes:
  GrabberNative:
    build:
      targets:
        GrabberNative: all
    test:
      targets:
        - GrabberNativeUITests
    run:
      config: Debug
