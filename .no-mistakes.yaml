# no-mistakes gate config. commands, review, document, protected_paths,
# test.instructions and no_ci are read only from main, so edits here take
# effect once merged.

commands:
  # The gate worktree has tracked files only. `npm ci` also runs patch-package
  # (postinstall). The vendor/igor-timer submodule is not needed: tsc excludes
  # vendor/ and no test imports it.
  prepare: "npm ci --no-audit --no-fund"
  # Every host check (TESTING.md rung 1): generates lib/generated_version.ts,
  # then jest (unit and component), the type check, the memdeck deal under
  # plain swiftc, and the runtimeVersion agreement. Maestro (rung 2) needs the
  # Simulator and is left out. ~15 s warm, ~35 s on a cold cache.
  test: "just test"

# No .github/workflows in this repo; the gate's test step is the only automated check.
no_ci: true

# Automatic fix commits must not touch the native surface: a change there is a
# native build plus a runtime-version bump, which is Igor's call (AGENTS.md, OTA-first).
protected_paths:
  - "ios/**"
  - "modules/**"
  - "patches/**"
  - "package.json"
  - "package-lock.json"
  - "app.json"

review:
  path_instructions:
    - path: "docs/stories/*.md"
      instructions: |
        These files are the spec of what the app does now. Mike Cohn use case plus Gherkin, exactly one
        Scenario per story with one When and one Then. A changed behaviour edits that story's acceptance
        criteria and adds its commit to the Status line; a new capability or new condition is a new story
        taking the next free ID in its journey's range (table in docs/stories/README.md). IDs are never
        reused. Status is either "implemented in <commits>; verified by <tests / simulator / the phone>" or
        "not implemented" with the asking issue; it lives only here. A bug goes on the story's Issues line.
        A code change that alters visible behaviour without a story edit is incomplete ("no story, not done").
    - path: "docs/superpowers/specs/*.md"
      instructions: |
        Design specs describe functionality, not implementation: user-visible behaviour, flows, edge cases,
        acceptance criteria, goals and non-goals. Flag file paths, prop or type names, function signatures,
        cache keys or component names here; those belong in docs/superpowers/plans/ or the code. A code
        change to a feature with a spec should carry the spec update in the same PR.
    - path: "lib/**"
      instructions: |
        Pure logic tested on the host; a behaviour change needs a jest test in __tests__/. Never import at the
        top of a file a native module some supported binary might lack: require it inside a function behind a
        try and degrade (lib/gistToken.ts and lib/gym/useDeviceTurn.ts are the pattern). Clustering, place
        matching and distance thresholds must be checked against the real fixtures
        (__tests__/fixtures/locations.json, context-grabber.db), not only synthetic points. Day bucketing is
        local time, sleep is noon-to-noon, stored timestamps are UTC milliseconds. The export JSON built in
        lib/share.ts is a contract Larry depends on (docs/user-needs.md, Export Contract).
    - path: "*.tsx"
      instructions: |
        Every user-visible error renders through <CopyableError> (components/CopyableError.tsx) with a
        context="Screen.operation" and the relevant state in extra, never a bare red Text.
    - path: "native/**"
      instructions: |
        The Swift-native app, built beside the React Native one (spec 2026-10-04-swift-native-app-design.md).
        Pure logic belongs in native/ContextCore with an XCTest (`just native-test`); native/App holds only
        what needs UIKit, SwiftUI or a device framework. A new behaviour reachable only by a tap needs a
        launch hook (GRABBER_*) and a session-log event so the simulator smoke can check it, and every new
        event gets a row in docs/DEBUGGING.md. Failures go to the session log as `error` with a `where`,
        once per spell. GrabberNative.xcodeproj is generated from native/project.yml and must not be
        committed. None of the OTA / runtime-version rules apply here.
    - path: "ios/**"
      instructions: |
        Native surface: needs `just deploy`, not OTA, and a runtime-version bump in both app.json and
        ios/ContextGrabber/Supporting/Expo.plist (scripts/bump-runtime-version.sh); the same holds for
        modules/, patches/, package.json and app.json. Never an `expo prebuild` (wipes DEVELOPMENT_TEAM);
        new widgets are Widget structs in the existing LiveActivity bundle, not a new target. Never put
        invalidatableContent() on a Button(intent:) label. PlayingCard.swift is compiled into both the app and
        the widget; its promises are checked by `just check-deal`.

document:
  instructions: |
    Ownership: docs/TESTING.md owns the test ladder and which change is verified where; docs/DEBUGGING.md
    owns the logs and the bug-to-issue flow; docs/stories/ owns what the app does and every story's status
    (no other status table); docs/superpowers/specs/ owns functional design, docs/superpowers/plans/ the
    implementation detail; docs/jtbd.md owns why. A pure refactor with no visible change needs no doc edit.

test:
  instructions: |
    Host rung only: run the touched module's host tests (`swift test --filter <Tests>` in native/ContextCore,
    `npx jest __tests__/<file>` for lib/ and the React Native screens) and read the diff. Do not build for, create,
    or boot a simulator, do not run xcodebuild against a simulator or device, and do not run Maestro: the driving
    session owns live evidence under the build turn and records it in the PR body (only one simulator may run on
    this Mac at a time). Do not run `just deploy`, `just build`, `just dev`, `just ota`, `just setup`,
    `just resync-native` or `just timer-cues` (they need a device, publish an update, open windows, or rewrite
    committed files). Do not re-run `just test`: the gate already ran it. Report which rung verified the change,
    and list what only the simulator or the phone can show (HealthKit, GPS, the audio session, widgets, Live
    Activities, Shortcuts, the voice bridge, iCloud delivery) as "to verify live".
    If a simulator is ever used despite the above: only one simulator on this Mac at a time, so before booting,
    check `xcrun simctl list devices booted` and wait until it is empty. When done, pass or fail, run
    `xcrun simctl shutdown` on every device you or your `xcodebuild` booted, `xcrun simctl delete` on every device
    you created, and make sure no `xcodebuild` or `xctest` you started is still running. Bound every
    `xcodebuild test` with a timeout. (Left-over simulators from test agents slowed this Mac four times since
    2026-10-04.)
